
name: EMAM PHOTO BACKUP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android Manifest XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")

          print("Checking file:", path)

          if not path.exists():
              raise SystemExit("ERROR: AndroidManifest.xml not found!")

          content = path.read_text(encoding="utf-8-sig")

          for number, line in enumerate(content.splitlines(), 1):
              print(f"{number}: {line}")

          try:
              ET.fromstring(content)
              print("SUCCESS: AndroidManifest.xml is valid XML")
          except ET.ParseError as error:
              print("MANIFEST XML ERROR:", error)
              raise

          PY

      - name: Build APK
        run: gradle assembleDebug --stacktrace --info

      - name: Verify APK
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: APK file was not generated!"
            exit 1
          fi
          echo "SUCCESS: APK generated successfully!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EMAM-PHOTO-BACKUP-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
